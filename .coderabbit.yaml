reviews:
  # Auto-review PRs targeting any long-lived branch: main, a release branch
  # (v0.6) or its dev branch (v0.6-dev). Feature/topic branches are reviewed
  # through the base they target. Patterns are regexes; keep them free of
  # optional groups, an `(-dev)?` suffix here did not match `v0.6-dev`.
  base_branches:
    - "main"
    - "v\\d+\\.\\d+"
    - "v\\d+\\.\\d+-dev"
  path_filters:
    - "!**/*.onnx"
    - "!**/*.txt"
    - "!**/*.stdout"
    - "!**/*.hash"
    - "!**/*.lock"
    - "!docs/website/src/_static/**"
    - "!executors/v0.3.x/runners/py-libs/pure-py/**"
    - "!executors/v0.3.x/runners/models/**"
    - "!executors/v0.3.x/runners/softfloat/berkeley-softfloat-3/**"
    - "!**/fuzz/inputs*/**"
    # Root-level system-test fixtures (contracts, expected outputs); crate and
    # runner test code under */tests/ is still reviewed.
    - "!tests/**"
    # genvm-tool is internal dev tooling; not worth reviewing.
    - "!support/tools/genvm-tool/**"
