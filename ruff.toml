indent-width = 2

exclude = ["executors/**", "libs/unhardcoded-engine"]

[format]
indent-style = "tab"
line-ending = "lf"
quote-style = "single"

docstring-code-format = true
skip-magic-trailing-comma = false

[lint]
ignore = ["E741"]

[lint.per-file-ignores]
# contract assets: the v0.2 sdk is used through a star import
"tests/system/**/assets/**" = ["F403", "F405"]

extend-select = [
    "E9",
    "F",
    "ASYNC",
    "RUF006",
    "D213", # docstring summary on next line
    "I", # sort imports
]
