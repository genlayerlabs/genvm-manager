[package]
name = "genvm-fuzzing"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# `default-features = false` keeps heapless, spin and lock_api out of the tree
postcard = { version = "1.1.3", default-features = false, features = [
    "use-std",
] }
serde = { version = "1.0.219", features = ["derive"] }

[dependencies.mutatis]
default-features = false
features = ["derive", "std"]
version = "0.5.3"
