name: GenVM get source
description: Checkout sources, optionally update submodules/third-party, and (optionally) set up Nix.
inputs:
  with_nix:
    description: if should setup nix
    required: false
    default: "false"
  third_party:
    description: third-party modules to install
    required: false
    default: --all
  github_token:
    description: GitHub token for nix setup
    required: false
  pr:
    description: >-
      PR number to diff against, overriding `github.event.pull_request.number`.
      A caller invoked by `workflow_dispatch` has no pull_request payload but
      does know the number, and without this its `changes` output would come
      back empty — silently checking nothing.
    required: false
    default: ""
outputs:
  changes:
    description: >-
      JSON object mapping each repo (`.` for the manager, submodule path for
      each executor) to {base_commit, branch_commit, has_changes}. Outside a
      pull request base_commit == branch_commit and has_changes is false.
    value: ${{ steps.changes.outputs.changes }}
runs:
  using: composite
  steps:
    - name: checkout submodules
      run: |
        cd "$GITHUB_WORKSPACE"
        git config --global user.email "ci@genlayerlabs.com"
        git config --global user.name "CI worker"
        python3 support/scripts/get-all-git.py "--third-party=${{ inputs.third_party }}"
      shell: bash -exo pipefail {0}
    - name: compute per-repo changes
      id: changes
      shell: bash -exo pipefail {0}
      env:
        GITHUB_PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        cd "$GITHUB_WORKSPACE"
        python3 support/scripts/ci-changes.py --github-output
    - name: setup nix
      if: ${{ inputs.with_nix == 'true' }}
      uses: cachix/install-nix-action@v31.6.2
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes recursive-nix
          substituters = https://cache.nixos.org/ https://nix-community.cachix.org https://cache.nix.kp2pml30.moe
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.nix.kp2pml30.moe:9izVvysdKza7+bjw2gI/etkDVfEQy+kne2aU/TZpA5o=
          download-attempts = 10
          connect-timeout = 15
          stalled-download-timeout = 60
          fallback = true
        github_access_token: ${{ inputs.github_token }}
        install_url: https://releases.nixos.org/nix/nix-2.24.14/install
