name: GenVM upload pipeline artifact
description: Upload one or more files as a pipeline-local artifact and return its token.
inputs:
  path:
    description: File or glob to upload
    required: true
outputs:
  token:
    description: Token to pass to download-pipeline-artifact
    value: ${{ steps.meta.outputs.token }}
runs:
  using: composite
  steps:
    - name: Validate input and generate token
      id: meta
      shell: bash
      env:
        PIPELINE_ARTIFACT_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail

        # A glob, not a single file: one platform job builds the manager plus
        # one tarball per active executor line and uploads them together.
        shopt -s nullglob
        matches=($PIPELINE_ARTIFACT_PATH)
        if [ "${#matches[@]}" -eq 0 ]; then
          echo "pipeline artifact path matched no files: $PIPELINE_ARTIFACT_PATH" >&2
          exit 1
        fi
        printf 'uploading:\n'
        printf '  %s\n' "${matches[@]}"

        token="pipeline-artifact-$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
        echo "token=$token" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.meta.outputs.token }}
        path: ${{ inputs.path }}
        if-no-files-found: error
        retention-days: 3
