name: Build Release For Target

on:
  workflow_call:
    inputs:
      targets:
        description: 'Nix targets to build, one per line'
        required: true
        type: string
      executor_version:
        description: 'Version name of the executor'
        required: true
        type: string
    outputs:
      artifact_token:
        description: "Token to download the built artifacts (build/genvm-<target>.tar.xz per target)"
        value: ${{ jobs.build.outputs.artifact_token }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # A called workflow cannot ask for more than the caller granted, and the
      # release workflow grants `actions: read`. Uploading an artifact does not
      # need `actions: write` anyway (upload-artifact uses the runtime token).
      contents: read
      actions: read
    outputs:
      artifact_token: ${{ steps.upload.outputs.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          swap-storage: false
          docker-images: false

      - name: Get source
        uses: ./.github/actions/get-src
        with:
          # The executor lines are submodules; nix builds run on
          # `.?submodules=1` and need them checked out.
          third_party: --all
          with_nix: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          TARGETS: ${{ inputs.targets }}
          EXECUTOR_VERSION: ${{ inputs.executor_version }}
        run: |
          set -euo pipefail
          # The targets of one job share a nix store, so building the manager
          # and every executor line here costs no more than building them in
          # separate jobs would.
          while IFS= read -r target; do
            [ -n "$target" ] || continue
            ./support/ci/run.sh pipeline build \
              --target "$target" \
              --executor-version "$EXECUTOR_VERSION"
          done <<< "$TARGETS"

      - name: Upload artifacts
        id: upload
        uses: ./.github/actions/upload-pipeline-artifact
        with:
          path: build/*.tar.xz
