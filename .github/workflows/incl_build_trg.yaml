name: Build Release For Target

on:
  workflow_call:
    inputs:
      target:
        description: 'Target to build'
        required: true
        type: string
      secondary_target:
        description: 'Secondary target to build'
        required: false
        type: string
        default: ''
      executor_version:
        description: 'Version name of the executor'
        required: true
        type: string
    outputs:
      artifact_token:
        description: "Token to download the built artifact"
        value: ${{ jobs.build.outputs.artifact_token }}
      secondary_artifact_token:
        description: "Token to download the secondary built artifact"
        value: ${{ jobs.build.outputs.secondary_artifact_token }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      artifact_token: ${{ steps.upload.outputs.token }}
      secondary_artifact_token: ${{ steps.upload_secondary.outputs.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          swap-storage: false
          docker-images: false

      - name: Get source
        uses: ./.github/actions/get-src
        with:
          # The executor lines are submodules; nix builds run on
          # `.?submodules=1` and need them checked out.
          third_party: --all
          with_nix: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          ./support/ci/pipelines/build.sh \
            --target ${{ inputs.target }} \
            --executor-version ${{ inputs.executor_version }}

      - name: Build Secondary
        if: ${{ inputs.secondary_target != '' }}
        run: |
          ./support/ci/pipelines/build.sh \
            --target ${{ inputs.secondary_target }} \
            --executor-version ${{ inputs.executor_version }}

      - name: Upload artifact
        id: upload
        uses: ./.github/actions/upload-pipeline-artifact
        with:
          file: build/genvm-${{ inputs.target }}.tar.xz

      - name: Upload secondary artifact
        id: upload_secondary
        if: ${{ inputs.secondary_target != '' }}
        uses: ./.github/actions/upload-pipeline-artifact
        with:
          file: build/genvm-${{ inputs.secondary_target }}.tar.xz
