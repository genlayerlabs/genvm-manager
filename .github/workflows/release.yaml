name: GenVM release

# incl_release_build_test.yaml plus a publisher: it plans, builds every artifact
# and tests every platform; this workflow attaches what it produced to a
# genvm-manager release tagged with `version` from .genvm-monorepo-root.
# `queue.yaml` runs the same pipeline on a PR (label `test-release-pipeline`),
# so everything below is the only release-only part.
#
#   genvm-<arch>-<os>.tar.xz  — manager + every active executor line for that
#                               platform (bin/, lib/, config/, data/, executor/)
#   genvm-universal.tar.xz    — shared runners under runners/ + legacy lines'
#                               runners at executor/<version>/legacy-runners
#
# All four extract at the same install root: a full install is one platform
# asset plus genvm-universal.
#
# Platforms are named the way nix names them (amd64-linux, arm64-linux,
# arm64-macos) everywhere: flake attrs, cells and published assets.

on:
  workflow_dispatch:
    inputs:
      version_override:
        type: string
        required: false
        description: "Override release tag (e.g., v1.2.3). Defaults to `version` from .genvm-monorepo-root"

defaults:
  run:
    shell: bash -x {0}

permissions:
  actions: read
  contents: read

jobs:
  # Publishing is the only thing that cares whether the tag is free, so the
  # check lives here rather than in the shared pipeline (which a PR runs at the
  # same tag on every push). Guards the build so a doomed release fails in
  # seconds instead of after three platform builds.
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ensure tag is free
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          set -euo pipefail
          tag="${VERSION_OVERRIDE:-$(jq -r .version .genvm-monorepo-root)}"
          release=$(
            gh api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -c --arg tag "$tag" \
                  '[.[][] | select(.tag_name == $tag)] | first // empty'
          )
          tag_sha=$(git ls-remote origin "refs/tags/$tag" | awk 'NR == 1 {print $1}')

          if [[ -z "${release}" && -z "${tag_sha}" ]]; then
            echo "tag $tag is free"
            exit 0
          fi

          draft=$(jq -r '.draft // false' <<<"${release:-{}}")
          author=$(jq -r '.author.login // ""' <<<"${release:-{}}")
          target=$(jq -r '.target_commitish // ""' <<<"${release:-{}}")
          if [[ "${draft}" == "true" \
            && "${author}" == "github-actions[bot]" \
            && ( "${target}" == "${SOURCE_SHA}" || "${tag_sha}" == "${SOURCE_SHA}" ) ]]; then
            echo "Recovering bot-owned draft release $tag at ${SOURCE_SHA}."
            exit 0
          fi

          if [[ -n "${release}" ]]; then
            echo "::error::release $tag already exists and is not a recoverable bot-owned draft at ${SOURCE_SHA}"
          else
            echo "::error::tag $tag already exists on origin at ${tag_sha}"
          fi
          if [[ -n "${tag_sha}" ]]; then
            echo "::error::existing tag SHA: ${tag_sha}"
          fi
          if [[ -n "${release}" ]]; then
            jq '{id, tag_name, target_commitish, draft, immutable, author: .author.login}' <<<"${release}"
          fi
          exit 1

  # Plan -> build every artifact -> test every platform. Its matrices are an
  # implementation detail; all we consume are the four artifact names.
  build-and-test:
    needs: [check-tag]
    uses: ./.github/workflows/incl_release_build_test.yaml
    with:
      version_override: ${{ inputs.version_override }}
    secrets: inherit

  release-publish:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      attestations: write  # Signed provenance for the exact release assets
      contents: write      # Tag and release creation
      id-token: write      # Short-lived Sigstore signing identity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history + tags: the release-notes step diffs against the
          # previous tag via `git describe`.
          fetch-depth: 0

      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build-and-test.outputs.artifact_notes }}
          path: artifacts/notes
      # Each artifact holds exactly one tarball, already named as the asset it
      # is published as, so they all land in one dir and need no renaming.
      - name: Download universal artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build-and-test.outputs.artifact_universal }}
          path: release-assets
      - name: Download amd64-linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build-and-test.outputs.artifact_amd64_linux }}
          path: release-assets
      - name: Download arm64-linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build-and-test.outputs.artifact_arm64_linux }}
          path: release-assets
      - name: Download arm64-macos artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build-and-test.outputs.artifact_arm64_macos }}
          path: release-assets

      - name: Check release assets
        run: |
          set -euo pipefail
          ls -l release-assets
          for asset in genvm-universal genvm-amd64-linux genvm-arm64-linux genvm-arm64-macos; do
            test -f "release-assets/$asset.tar.xz" || {
              echo "::error::missing release asset $asset.tar.xz"
              exit 1
            }
          done

      - name: Attest release asset build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: release-assets/*.tar.xz

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*.tar.xz
          name: Release ${{ needs.build-and-test.outputs.tag }}
          tag_name: ${{ needs.build-and-test.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: artifacts/notes/${{ needs.build-and-test.outputs.notes_file }}
          # Immutable releases lock as soon as they are published. Build the
          # complete release as a draft so every attested asset is attached
          # before publication.
          draft: true
          overwrite_files: true
          prerelease: ${{ contains(needs.build-and-test.outputs.tag, '-') }}

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-and-test.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
