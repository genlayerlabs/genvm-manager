name: branch / forward version to main

# main is the default branch but is only an ALIAS of the latest active
# dev branch (v<latest>-dev): it always points at that branch's tip and
# is never committed to directly. On every push to a dev branch we
# fast-forward main to it — but only for the LATEST active version, so
# parallel trains (e.g. v0.3-dev and v0.6-dev) don't fight over main.
#
# main is protected, so the default GITHUB_TOKEN cannot push to it. We
# push over SSH with a write deploy key (GENVM_CI_PRIVATE_KEY), which must
# be on main's ruleset bypass list. The push is plain (non-force), so it
# only succeeds on a real fast-forward and is rejected if the branches
# have diverged.

on:
  push:
    branches: ['v*-dev']

permissions:
  contents: read

# Serialize forwards: two quick pushes to dev branches would otherwise spawn
# concurrent jobs racing to push main, and the non-force loser fails noisily.
# Queue them (don't cancel) so each fast-forward is evaluated against the
# latest main.
concurrency:
  group: forward-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash -exo pipefail {0}

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.GENVM_CI_PRIVATE_KEY }}
          # Full history: a shallow checkout only has the version branch's
          # tip, not main's, so git cannot prove the push is a
          # fast-forward and the server rejects it ("fetch first").
          fetch-depth: 0

      - name: Fast-forward main to latest dev branch
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          # Decide the current manager train from main's `version` field (the
          # authoritative alias), NOT the pushed branch's own copy — an older
          # dev branch carries a stale version and would otherwise try to drag
          # main backwards once a newer train exists.
          # $RUNNER_TEMP, not /tmp: the runner wipes it between jobs, so nothing
          # is left behind on a self-hosted box.
          root_json="${RUNNER_TEMP}/main-monorepo-root.json"
          git show origin/main:.genvm-monorepo-root > "$root_json"
          MANAGER="$(MONOREPO_ROOT="$root_json" ./support/ci/run.sh tool branch-versions manager)"
          if [ "$BRANCH" != "v${MANAGER}-dev" ]; then
            echo "Pushed branch ${BRANCH} is not the latest dev branch (v${MANAGER}-dev); nothing to do"
            exit 0
          fi
          echo "Fast-forwarding main to ${GITHUB_SHA} (from ${BRANCH})"
          git push origin "${GITHUB_SHA}:refs/heads/main"
