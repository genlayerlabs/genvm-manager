name: branch / provision dev branches and standing PRs

# Materialize the manager train declared by .genvm-monorepo-root: the release
# branch v<X>, the dev branch v<X>-dev, and the standing release-gate PR
# v<X>-dev -> v<X> (see support/ci/run.sh tool provision-branches).
#
# Idempotent — safe to re-run. Fires automatically when the train declaration
# changes, and on demand via the Actions tab.

on:
  workflow_dispatch:
  push:
    branches: ['v*-dev', main]
    paths: ['.genvm-monorepo-root']

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash -exo pipefail {0}

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy key so branch-creating pushes bypass protection on the
          # (protected) version / dev branches. Full history so the
          # source refs for new branches resolve.
          ssh-key: ${{ secrets.GENVM_CI_PRIVATE_KEY }}
          fetch-depth: 0

      - name: Provision branches and standing PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./support/ci/run.sh tool provision-branches
