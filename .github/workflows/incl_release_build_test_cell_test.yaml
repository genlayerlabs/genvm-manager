name: Test one release platform cell

# One cell of plan-release-matrix's test matrix. Materializes the built tarballs
# into build/out and replays the cell's `test` steps against them: `genvm-tool
# configure` writes build/info.json pointing at that tree, so the runner
# exercises the downloaded artifacts and never builds.

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      platform_artifact:
        description: artifact holding this platform's manager + executor tarballs
        required: true
        type: string
      runners_artifact:
        description: artifact holding the universal runners; empty to skip
        required: false
        type: string
        default: ""
      with_nix:
        required: false
        type: boolean
        default: true
      setup_python:
        required: false
        type: boolean
        default: false
      job_json:
        required: true
        type: string

# A reusable workflow does not inherit the caller's `defaults`, so the shell
# is set here too: GitHub's stock `bash -e {0}` has no `pipefail`.
defaults:
  run:
    shell: bash -exo pipefail {0}

jobs:
  test:
    name: release-test / ${{ inputs.name }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check job keys
        env:
          JOB_JSON: ${{ inputs.job_json }}
        run: ./support/ci/run.sh pipeline check-cell-keys --job-json "$JOB_JSON" test

      - name: Get source
        uses: ./.github/actions/get-src
        with:
          third_party: --all
          with_nix: ${{ inputs.with_nix && 'true' || 'false' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          nix_cache_pull_token: ${{ secrets.NIX_CACHE_PULL_TOKEN }}

      - name: Setup Python
        if: ${{ inputs.setup_python }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.platform_artifact }}
          path: ${{ runner.temp }}/release-artifacts

      # Skipped for cells that cannot use them: a foreign-arch tree has nothing
      # to run the runners with.
      - name: Download runners artifact
        if: ${{ inputs.runners_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.runners_artifact }}
          path: ${{ runner.temp }}/release-artifacts

      - name: Materialize artifacts
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/release-artifacts
        run: |
          set -euo pipefail
          # Every tarball — manager, each executor line, and the runners —
          # overlays onto the same install root.
          mkdir -p build/out
          shopt -s nullglob
          archives=("$ARTIFACTS_DIR"/*.tar.xz)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::no tarballs in $ARTIFACTS_DIR"
            exit 1
          fi
          printf 'extracting:\n'
          printf '  %s\n' "${archives[@]}"
          for archive in "${archives[@]}"; do
            tar -xf "$archive" -C build/out --no-same-owner
          done

      - name: "Job: test"
        uses: ./.github/actions/matrix-cell-step
        with:
          job_json: ${{ inputs.job_json }}
          key: test

      # A cell without nix has no store to push, and the macOS cells have no
      # nix at all.
      - name: Push to nix cache
        if: ${{ !cancelled() && inputs.with_nix }}
        uses: genlayerlabs/github-actions/nix-cache-push@39b0a0d5e9bb27a1612d2e98b0f8509d31745157 # main
        with:
          token: ${{ secrets.NIX_CACHE_PUSH_TOKEN }}

      # Postmortem on the same runner the cell just used; see the action for
      # what it probes and why it is not an `incl_*` reusable workflow.
      # `failure()` covers any earlier step failing and is already false on a
      # cancel, so it needs no !cancelled() guard.
      # `continue-on-error` is belt-and-braces: the action already exits 0.
      # Probes are Linux-only, so skipped on this workflow's macOS cells.
      - name: Postmortem
        if: ${{ failure() && !startsWith(inputs.runs_on, 'macos') }}
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/postmortem
