name: branch / merge PR into dev

# The repo has NO GitHub merge queue. A PR lands on a dev branch (v<X>-dev)
# when a maintainer ticks the "Merge" box on the PR action panel
# (branch_pr_actions.yaml), which calls this reusable workflow. It
# re-checks every gate against the EXACT head commit and then advances the
# dev branch by a plain (fast-forward-only) push, so what lands is
# byte-identical to what CI and E2E validated.
#
# Gates (all required):
#   1. base branch is a v<X>-dev branch
#   2. PR carries the `rtm` (ready-to-merge) label
#   3. full GenVM CI (queue.yaml) concluded success on the head commit
#   4. the cross-repo E2E check concluded success on the head commit
#   5. the PR is 0 commits behind base (head already contains base tip)
#
# Merge strategy:
#   - 1 commit            -> fast-forward the original commit (SHA preserved)
#   - more than 1 commit  -> squash into a single commit on top of base,
#                            then fast-forward
# Either way the PR is closed afterwards.
#
# Executor mirror: the landed manager commit gitlinks into the executor
# submodule; the script fast-forwards the executor's SAME-NAMED branch to
# that gitlink commit. It fast-forward-checks both repos up front, then
# pushes the executor first (the dependency) and the manager second.
#
# The dev branches are protected; the default GITHUB_TOKEN cannot push to
# them. We push over SSH with the GENVM_CI_PRIVATE_KEY deploy key (on the
# dev-branch ruleset bypass list), and to the executor repo with a separate
# GENVM_EXECUTOR_CI_PRIVATE_KEY deploy key (on the executor's bypass list).
# Pushes are non-force, so a base that advanced between the checks and the
# push is safely rejected. This job never runs PR code — only git plumbing
# and API reads. The caller is responsible for restricting who can trigger a
# merge (maintainers only).

on:
  workflow_call:
    inputs:
      pr_number:
        description: number of the PR to merge
        type: string
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  actions: read

defaults:
  run:
    shell: bash -x {0}

env:
  # check-run name (case-insensitive substring) the genlayer-e2e pipeline
  # posts on the head commit. Adjust if that pipeline renames its check.
  E2E_CHECK_PATTERN: "e2e"

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      # Checkout with the manager deploy key so the (protected) dev branch
      # push succeeds. Submodules are initialised in the next step with a
      # SEPARATE executor key — the manager key cannot read/write the
      # executor repo. The script never runs PR code.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.GENVM_CI_PRIVATE_KEY }}
          fetch-depth: 0
          submodules: false

      # The executor submodule to mirror is the one for the PR's target line: a
      # PR into v<X>-dev concerns executors/v<X>.x. Derive it from the PR base,
      # validated against the active trains in .genvm-monorepo-root (via
      # branch-versions.py), rather than hardcoding a single line.
      - name: Resolve executor submodule from PR base
        id: exec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          base="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)"
          line="${base%-dev}"                                    # v0.3-dev -> v0.3
          if ! python3 support/ci/branch-versions.py list | grep -qx "${line#v}"; then
            echo "::error::PR base '$base' is not an active version train"; exit 1
          fi
          echo "submodule=executors/${line}.x" >> "$GITHUB_OUTPUT"

      - name: Set up executor submodule push access
        env:
          # Deploy key with write access to the executor repo, on its
          # protected-branch ruleset bypass list. The executor submodule's
          # origin must be an SSH URL (git@github.com:...) for this key to
          # apply.
          EXECUTOR_DEPLOY_KEY: ${{ secrets.GENVM_EXECUTOR_CI_PRIVATE_KEY }}
          SUBMODULE: ${{ steps.exec.outputs.submodule }}
        run: |
          install -m700 -d ~/.ssh
          key=~/.ssh/executor_ci
          printf '%s\n' "$EXECUTOR_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          ssh="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          # Fetch the submodule with the executor key, then bind that key to
          # the submodule only (per-repo core.sshCommand) so the later mirror
          # push uses it while the manager push keeps the checkout credentials.
          git -c core.sshCommand="$ssh" submodule update --init "$SUBMODULE"
          git -C "$SUBMODULE" config core.sshCommand "$ssh"

      - name: Validate gates, mirror executor, fast-forward / squash, close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXECUTOR_SUBMODULE: ${{ steps.exec.outputs.submodule }}
        run: python3 support/ci/genvm-merge-into-dev.py
