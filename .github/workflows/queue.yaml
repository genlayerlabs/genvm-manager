name: GenVM full

# Full GenVM CI. The repo has NO GitHub merge queue: this is the
# authoritative "genvm CI" gate the Merge action
# (branch_merge_into_dev.yaml) requires to be green on the exact head it
# fast-forwards.
#
# For every push to a PR targeting a dev branch (v<X>-dev):
#   - `initial` (cheap pre-commit + 0-behind check) ALWAYS runs;
#   - the heavy test jobs run only when a run-full-tests marker is set —
#     the `rtm` (ready-to-merge) label or the `run-full-tests` label (the
#     "Force run full tests" checkbox sets the latter);
#   - without a marker `validate-end` fails, so the CI check stays red
#     until a full run has happened.
#
# The action panel ("Force"/"Rerun full tests") triggers a run directly via
# `workflow_dispatch` rather than relying on a label edit: a label applied by
# the bot's GITHUB_TOKEN does NOT emit a `labeled` event (GitHub suppresses
# recursive runs), but a `workflow_dispatch` from that same token DOES run.
# The dispatch targets the PR head branch, so the run's head_sha equals the
# PR head and the Merge gate (which matches by head_sha) counts it.
on:
  pull_request:
    branches: ['v*-dev']
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number this manual run validates (used only for the run name)
        type: string
        required: false

run-name: >-
  GenVM full${{ github.event_name == 'workflow_dispatch' && format(' (manual, PR #{0})', inputs.pr) || '' }}

defaults:
  run:
    shell: bash -x {0}

env:
  GCS_BUCKET: "gh-af"

jobs:
  initial:
    uses: ./.github/workflows/incl_initial.yaml
    secrets: inherit

  # Precondition (run.sh tool pr-branches check): the PR must be landable via the
  # panel (Provision then Merge), which lands the manager and its executors almost-
  # atomically. So every repo (manager + each executor line) must be rebased on its
  # base, and every executor line present at base must have its pinned commit in the
  # executor repo (ahead-of-base is fine — that work lands with the PR; a commit
  # missing from the executor repo is not). Read-only (gh API, no submodule checkout).
  #
  # Runs on same-repo PRs AND on workflow_dispatch with a PR number (the panel's
  # rerun path, whose run the Merge gate consumes — so the precondition must hold
  # there too; the PR number then comes from inputs.pr). Fork PRs are skipped: they
  # get no secrets (the executor PAT would be empty) and cannot push executor mirror
  # branches, so there is nothing to gate. It checks out the PR being validated
  # (refs/pull/<n>/head) so the scripts and .genvm-monorepo-root match that PR — on
  # dispatch the base branch is not in the event context, and its default-branch tree
  # is the wrong commit. (Checking out PR code is not an extra exposure: for
  # pull_request GitHub already runs this workflow file from the PR, so a same-repo
  # author controls it regardless.)
  check-executor-prs:
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.pr != '') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr }}/head
      - name: Executor mirror PRs are landed
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          MANAGER_REPO: ${{ github.repository }}
          MANAGER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTOR_TOKEN: ${{ secrets.GENVM_EXECUTOR_PR_TOKEN }}
        run: ./support/ci/run.sh tool pr-branches check

  gate-check:
    needs: [initial, check-executor-prs]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Check gate results
        run: |
          if [ "${{ needs.initial.result }}" != "success" ]; then
            echo "::error::initial checks failed"
            exit 1
          fi
          # Executor precondition: fail on failure/cancelled. Skipped (fork PR or
          # manual dispatch, where check-executor-prs does not run) is acceptable.
          case "${{ needs.check-executor-prs.result }}" in
            failure | cancelled)
              echo "::error::executor mirror PR precondition failed"
              exit 1
              ;;
          esac

  module-test-python:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'rtm') || contains(github.event.pull_request.labels.*.name, 'run-full-tests') }}
    needs: [gate-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Get source
        uses: ./.github/actions/get-src
        with:
          third_party: --all
          with_nix: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: ./support/ci/run.sh pipeline test-python

  module-test-rust-fuzz:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'rtm') || contains(github.event.pull_request.labels.*.name, 'run-full-tests') }}
    needs: [gate-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses:  insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          swap-storage: false
          docker-images: false
      - name: Get source
        uses: ./.github/actions/get-src
        with:
          third_party: --all
          with_nix: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          echo core | sudo tee /proc/sys/kernel/core_pattern
          echo performance | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor
          echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
          ./support/ci/run.sh pipeline test-rust-fuzz
          ./support/ci/run.sh pipeline cargo-clippy
        env:
          OPENAIKEY: ${{ secrets.OPENAIKEY }}
          HEURISTKEY: ${{ secrets.HEURISTKEY }}
          ANTHROPICKEY: ${{ secrets.ANTHROPICKEY }}
          XAIKEY: ${{ secrets.XAIKEY }}
          GEMINIKEY: ${{ secrets.GEMINIKEY }}

  module-test-rust:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'rtm') || contains(github.event.pull_request.labels.*.name, 'run-full-tests') }}
    needs: [gate-check]
    runs-on: ubuntu-latest
    env:
      # Only used to upload freshly-built runners to the GCS cache; this is
      # best-effort (see the `|| true` upload in test-rust.sh). Absent on fork
      # PRs, so the GCP steps below are skipped and runners come from the public
      # bucket instead of failing the whole job.
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses:  insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          swap-storage: false
          docker-images: false
      - name: Get source
        uses: ./.github/actions/get-src
        with:
          third_party: --all
          with_nix: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate to Google Cloud
        if: ${{ env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK # needed for gcloud to upload runners to GCS for caching
        if: ${{ env.GCP_SA_KEY != '' }}
        uses: google-github-actions/setup-gcloud@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - run: |
          ./support/ci/run.sh pipeline test-rust
        env:
          OPENAIKEY: ${{ secrets.OPENAIKEY }}
          HEURISTKEY: ${{ secrets.HEURISTKEY }}
          ANTHROPICKEY: ${{ secrets.ANTHROPICKEY }}
          XAIKEY: ${{ secrets.XAIKEY }}
          GEMINIKEY: ${{ secrets.GEMINIKEY }}

  validate-end:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - initial
      - gate-check
      - module-test-python
      - module-test-rust
      - module-test-rust-fuzz
    env:
      HAS_MARKER: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'rtm') || contains(github.event.pull_request.labels.*.name, 'run-full-tests') }}
    steps:
      - name: check
        run: |
          # initial (pre-commit + 0-behind) must always pass.
          if [ "${{ needs.initial.result }}" != "success" ]; then
            echo "::error::initial checks failed"
            exit 1
          fi
          # No run-full-tests marker -> heavy tests were skipped; keep the
          # gate red so the PR is not mergeable until they run.
          if [ "$HAS_MARKER" != "true" ]; then
            echo "::error::full tests have not run — add the 'rtm' label or check 'Force run full tests' on the action panel"
            exit 1
          fi
          results="${{ needs.module-test-python.result }} ${{ needs.module-test-rust.result }} ${{ needs.module-test-rust-fuzz.result }}"
          echo "$results"
          if echo "$results" | grep -qiE '(failure|cancelled|skipped)'; then
            echo "::error::one or more full-test jobs failed/cancelled/skipped"
            exit 1
          fi
