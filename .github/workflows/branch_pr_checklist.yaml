name: branch / post PR action panel

# When a PR is opened against main or a dev branch (v<X>-dev) we:
#   - post the action panel (checklist comment) that replaces the old
#     /genvm-* slash commands;
#   - auto-add `ci-safe` if the PR author has write access, so their PR can
#     immediately use the panel. For everyone else a write-role maintainer
#     adds `ci-safe` by hand once the PR is vetted.
#
# pull_request_target gives a write-scoped token even for fork PRs; we only
# call label/comment APIs and never check out or run PR code. The HTML
# marker lets branch_pr_actions.yaml recognise the panel later.

on:
  pull_request_target:
    branches: [main, 'v*-dev']
    # `edited` fires when the PR base branch is changed, so a PR retargeted
    # onto a dev branch also gets the panel.
    types: [opened, edited]

permissions:
  pull-requests: write
  issues: write

defaults:
  run:
    shell: bash -exo pipefail {0}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Post action panel
        run: |
          # Only post once: skip if a panel (identified by the HTML marker)
          # already exists on the PR. `edited` can fire repeatedly.
          #
          # Collect first, match second — NOT `gh ... | grep -qF`. Under
          # `pipefail`, `grep -q` exiting at the first match can SIGPIPE a `gh`
          # still writing a large comment list, which makes the pipeline
          # non-zero and sends us down the "no panel yet" path — posting a
          # second panel on exactly the busiest PRs.
          comments="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments --jq '.comments[].body')"
          if grep -qF '<!-- genvm-actions -->' <<<"$comments"; then
            echo "action panel already present; skipping"
            exit 0
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$(cat <<'EOF'
          <!-- genvm-actions -->
          ### GenVM PR actions

          Tick a box to run it (the box unticks itself when handled). Actions only run while the PR has the **`ci-safe`** label.

          <!-- The `action:<id>` markers below are what the handler dispatches on; the wording beside them is free to change. -->


          - [ ] Force run full tests <!-- action:force -->
          - [ ] Rerun full tests <!-- action:rerun -->
          - [ ] Provision executor PRs <!-- action:provision -->
          - [ ] Merge into dev <!-- action:merge -->

          <details><summary><b>Merge</b></summary>

          Requires, on the exact head commit:

          - an approving review from a maintainer (any push revokes it), or the **`rtm`** label
          - linear history — 0 commits behind base
          - green full GenVM CI and green cross-repo E2E

          Full CI starts only through "Force" or "Rerun full tests" above. "Force" also sets **`run-full-tests`**, making future pushes run the full suite; **`rtm`** only authorizes Merge.

          Every repo lands ONE squashed commit, subject `<PR title> (#N)`.
          </details>

          <details><summary><b>Commands</b></summary>

          - `/genvm-force-merge` — **repo admin** only: land without the review, full-CI and E2E gates, for when those signals are unobtainable, not when they are red. Base, title and 0-behind still apply, and the skip is recorded on the PR.
          </details>
          EOF
          )"

      - name: Auto-mark ci-safe for write-access authors
        run: |
          perm="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq '.permission' 2>/dev/null || echo none)"
          case "$perm" in
            admin|write|maintain)
              echo "author $AUTHOR has '$perm' access; marking ci-safe"
              gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f 'labels[]=ci-safe' ;;
            *)
              echo "author $AUTHOR has '$perm' access; leaving unmarked (a write-role maintainer must add ci-safe)" ;;
          esac
