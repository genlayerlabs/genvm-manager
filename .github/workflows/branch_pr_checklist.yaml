name: branch / post PR action panel

# When a PR is opened against main or a dev branch (v<X>-dev) we:
#   - post the action panel and document its companion slash commands;
#   - auto-add `ci-safe` if the PR author has write access, so their PR can
#     immediately use the panel. For everyone else a write-role maintainer
#     adds `ci-safe` by hand once the PR is vetted.
#
# pull_request_target gives a write-scoped token even for fork PRs; we only
# call label/comment APIs and never check out or run PR code. The HTML
# marker lets branch_pr_actions.yaml recognise the panel later.

on:
  pull_request_target:
    branches: [main, 'v*-dev']
    # `edited` catches retargets; `synchronize` migrates panels already posted
    # by an older workflow revision without a repository-wide write sweep.
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write
  issues: write

defaults:
  run:
    shell: bash -exo pipefail {0}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Post or refresh action panel
        run: |
          labels="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')"
          force=false
          if grep -qxF 'run-full-tests' <<<"$labels"; then
            force=true
          fi

          body="$(cat <<'EOF'
          <!-- genvm-actions -->
          ### GenVM PR actions

          Tick a box to run it (the box unticks itself when handled). Actions only run while the PR has the **`ci-safe`** label.

          <!-- The `action:<id>` markers below are what the handler dispatches on; the wording beside them is free to change. -->


          - [ ] Force run full tests <!-- action:force -->
          - [ ] Provision executor PRs <!-- action:provision -->

          <details><summary><b>Commands</b></summary>

          - `/genvm-run-tests` — run full tests once for the current manager snapshot
          - `/merge` — queue the exact manager snapshot through the App-owned E2E merge train
          </details>
          EOF
          )"
          if [ "$force" = true ]; then
            body="${body/- \[ \] Force run full tests/- [x] Force run full tests}"
          fi

          panel_ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- genvm-actions -->"))) | .id')"
          panel_id="${panel_ids%%$'\n'*}"
          if [ -z "$panel_id" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
            exit 0
          fi

          while IFS= read -r panel_id; do
            current="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$panel_id" --jq '.body')"
            if [ "$current" = "$body" ]; then
              echo "action panel $panel_id is current; skipping"
              continue
            fi
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$panel_id" -f "body=$body"
          done <<<"$panel_ids"

      - name: Auto-mark ci-safe for write-access authors
        run: |
          perm="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq '.permission' 2>/dev/null || echo none)"
          case "$perm" in
            admin|write|maintain)
              echo "author $AUTHOR has '$perm' access; marking ci-safe"
              gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f 'labels[]=ci-safe' ;;
            *)
              echo "author $AUTHOR has '$perm' access; leaving unmarked (a write-role maintainer must add ci-safe)" ;;
          esac
