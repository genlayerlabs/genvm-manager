name: branch / open linked executor PRs

# When a manager PR is opened against a dev branch (v<X>-dev), open the matching
# executor PR in the genvm-executor repo (`pr/<line>/<feature>` -> v<X>-dev) and
# list it on the manager PR as an `executor: <url>` line. The executor work lives
# on a line-namespaced mirror branch the developer pushed via
# `genvm-tool git create-branches`. See support/ci/open-executor-prs.py.
#
# pull_request_target gives a manager-scoped write token for the comment; the
# cross-repo executor PR needs a PAT with genvm-executor access
# (GENVM_EXECUTOR_PR_TOKEN) — the default GITHUB_TOKEN cannot reach another repo.
# We check out only the base repo to run the trusted script — never PR code.

on:
  pull_request_target:
    branches: ['v*-dev']
    types: [opened]

permissions:
  pull-requests: write
  issues: write

defaults:
  run:
    shell: bash -x {0}

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open and link executor PR(s)
        env:
          MANAGER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTOR_TOKEN: ${{ secrets.GENVM_EXECUTOR_PR_TOKEN }}
          MANAGER_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python3 support/ci/open-executor-prs.py
