name: branch / run full tests command

# `/genvm-run-tests` is the one-shot counterpart to the sticky
# `run-full-tests` label. The command starts full CI for the PR's exact head,
# links the run in a bot comment; the run's `report-request` job reflects
# completion on the command with a native GitHub reaction. This is
# manager-owned CI; it does not call the E2E App.

on:
  issue_comment:
    types: [created]

permissions: {}

defaults:
  run:
    shell: bash -exo pipefail {0}

jobs:
  start:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/genvm-run-tests' &&
      contains(github.event.issue.labels.*.name, 'ci-safe')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      # issue_comment workflows run from the default branch. Keep that trusted
      # checkout: this handler dispatches PR code with credentials in scope
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Dispatch full tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          SENDER: ${{ github.event.sender.login }}
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: ./support/ci/run.sh tool full-tests-command start
