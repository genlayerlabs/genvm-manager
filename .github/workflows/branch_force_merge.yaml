name: branch / force merge PR into dev

# `/genvm-force-merge` in a PR comment: land the PR without requiring the
# review, full-CI and E2E gates. For when those signals cannot be obtained at
# all (the E2E pipeline is down, the org's Actions budget is exhausted, ...)
# rather than for when they are red — a forced merge lands a commit no green run
# ever covered, and says so on the PR.
#
# Only a REPO ADMIN (or org owner, whom GitHub reports as admin here) may use
# it. The panel's Merge box stays the normal path and keeps every gate.
#
# Authorization runs HERE, in the workflow file, not in the merge script: an
# `issue_comment` workflow always runs from the default branch, so this YAML is
# trusted, whereas the merge job checks out the PR head and runs its scripts.
# The merge workflow re-checks both the admin role and the head sha in its own
# trusted guard step before any PR code is fetched.
#
# The command is bound to the head commit it was typed on: the admin authorizes
# a specific commit, not the branch. A push landing between the comment and the
# merge aborts it rather than riding in on the authorization.
#
# Written as its own workflow rather than a branch of branch_pr_actions.yaml
# because it triggers on a different event (`issue_comment: created`, not
# `edited`) and needs an authorization rule of its own.
#
# Deliberately NO workflow-level concurrency: the group would be taken before
# the job's `if` runs, so every unrelated comment on any PR would enter it and
# could evict a pending real one (a `concurrency` group keeps a single pending
# run, `cancel-in-progress: false` or not). The merge itself is already
# serialised repository-wide by branch_merge_into_dev.yaml's own group.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  actions: read

defaults:
  run:
    shell: bash -exo pipefail {0}

jobs:
  authorize:
    # `startsWith` is only a cheap pre-filter (expressions have no regex); the
    # step below requires the command to be the whole first line, so neither a
    # quoted reply nor `/genvm-force-merge-later` fires it. The `ci-safe` gate is
    # the same one the merge workflow re-checks — the merge runs PR code.
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/genvm-force-merge') &&
      contains(github.event.issue.labels.*.name, 'ci-safe')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      head_sha: ${{ steps.check.outputs.head_sha }}
    steps:
      # No checkout: nothing in this job may come from the PR.
      - name: Require an exact command from a repo admin
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENDER: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          PR_NUMBER: ${{ github.event.issue.number }}
          # Through the environment, never interpolated into the script: the
          # body is attacker-controlled text.
          BODY: ${{ github.event.comment.body }}
        run: |
          echo "ok=false" >> "$GITHUB_OUTPUT"

          # The command must be the entire first line. `startsWith` above would
          # also accept `/genvm-force-merge-not-yet` or a longer sentence.
          first="$(printf '%s' "$BODY" | head -n1 | tr -d '\r' | xargs || true)"
          if [ "$first" != '/genvm-force-merge' ]; then
            echo "first line is '$first', not the bare command; ignoring"
            exit 0
          fi

          # A non-collaborator 403/404s here, which is "no role", not an error.
          perm="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" \
            --jq '.permission' 2>/dev/null || echo none)"
          if [ "$perm" != admin ]; then
            echo "::warning::$SENDER has '$perm' access; /genvm-force-merge is admin-only"
            # React rather than comment: the command is visible to anyone on a
            # public PR, and a refusal comment per attempt is a spam vector.
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
              -f 'content=-1'
            exit 0
          fi

          # Bind the authorization to the commit it was typed on.
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          {
            echo "ok=true"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f 'content=+1'

  merge:
    needs: authorize
    if: needs.authorize.outputs.ok == 'true'
    uses: ./.github/workflows/branch_merge_into_dev.yaml
    with:
      pr_number: ${{ github.event.issue.number }}
      force_actor: ${{ github.event.comment.user.login }}
      force_head_sha: ${{ needs.authorize.outputs.head_sha }}
    secrets: inherit
