# Static fields merged into the generated data/manifest.yaml by
# `genvm-tool build-manifest`. The version-specific section (`executor_versions`)
# is derived from the active executor submodules; everything here is
# build-independent and lives under version control.
runners_download_urls:
  - "https://storage.googleapis.com/gh-af/genvm_runners/{name}/{hash}.{ext}"
# Fallback source for a line missing from the install root (a platform release
# asset already bundles every active line). `{version}` is the line's
# executor-version and `{platform}` the nix-style token (amd64-linux,
# arm64-macos, ...). Accepted only against the line's pinned `executor-sha256`.
executor_download_urls:
  - "https://github.com/genlayerlabs/genvm-executor/releases/download/{version}/genvm-{platform}-executor.tar.xz"
