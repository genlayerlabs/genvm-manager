[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61"]

[project]
dependencies = [
    "aiohttp",
    "jsonnet",
    "shtab",
    "ruamel.yaml",
    "cloudpickle",
    "python-dotenv",
    "questionary",
]
description = "GenVM monorepo git helper (build, tests, hooks, ls)"
name = "genvm-tool"
requires-python = ">=3.12"
version = "0.1.0"

[project.scripts]
genvm-tool = "genvm_tool.__main__:main"

[tool.setuptools.packages.find]
include = ["genvm_tool*"]
